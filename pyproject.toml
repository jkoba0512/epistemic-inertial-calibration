[project]
name = "epistemic-inertial-calibration"
version = "0.1.0"
description = "Active calibration of robot inertial parameters (mass, CoM, inertia) via information-seeking excitation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jun Kobayashi" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# The iiwa 7-DoF case study requires Pinocchio, which is kept out of the core
# dependencies because it includes native binaries. Install with:
#   uv sync --extra iiwa
# iiwa tests pytest.importorskip("pinocchio") so they skip when this extra is absent.
iiwa = [
    "pin>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic_inertial_calibration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
